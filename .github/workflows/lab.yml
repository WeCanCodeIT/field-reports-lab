name: lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  health:
    # The lab itself works on every system learners use: setup, fake API, names audit, no network.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/audit_names.py
      - run: python -m pytest -k "not flaw"

  progress:
    # Your progress: every check up to the module in lab.toml. Make this a required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python labcheck.py current

  secrets:
    # Fails while a key is written into the code (module 2 fixes it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner
