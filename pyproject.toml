[project]
name = "fieldreports"
version = "1.0.0"
description = "Practice lab for Spec-Driven Software Development with Claude Code (We Can Code IT)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7", "responses>=0.25"]

[tool.pytest.ini_options]
addopts = "--disable-socket -q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["fieldreports"]
